[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cron-lint"
version = "1.0.0"
description = "Static checker for crontab files: dead schedules, impossible dates and wrong field formats"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "wyn-cmd", email = "wyn-cmd@users.noreply.github.com" }]
keywords = ["cron", "crontab", "linter", "scheduling", "sysadmin"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]

[project.scripts]
cron-lint = "cronlint:main"

[tool.setuptools]
py-modules = ["cronlint"]
